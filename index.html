<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#51c2bd">
    <title>Roleta Práctica | EXPOSUL 2026</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <span class="wash wash-one"></span>
      <span class="wash wash-two"></span>
      <span class="spark spark-one"></span>
      <span class="spark spark-two"></span>
      <span class="spark spark-three"></span>
      <span class="spark spark-four"></span>
      <span class="party-dot party-dot-one"></span>
      <span class="party-dot party-dot-two"></span>
      <span class="party-dot party-dot-three"></span>
      <span class="party-dot party-dot-four"></span>
    </div>

    <main class="app-shell">
      <header class="brand-strip">
        <img class="brand" src="assets/logo-practica-transparent.png" alt="Práctica">
        <div class="event-pill">
          <span>EXPOSUL 2026</span>
          <strong>Chapadão do Sul</strong>
        </div>
      </header>

      <section class="screen wheel-screen is-active" id="wheelScreen" aria-labelledby="wheelTitle">
        <div class="step-copy">
          <h1 id="wheelTitle">Gire e ganhe</h1>
          <p id="playerName">Toque na roleta e descubra seu presente.</p>
        </div>

        <div class="wheel-zone" aria-label="Roleta de prêmios">
          <span class="wheel-aura" aria-hidden="true"></span>
          <button class="wheel-trigger wheel-frame" id="spinButton" type="button" aria-describedby="claimHint" aria-label="Girar roleta de prêmios">
            <span class="tap-ring" aria-hidden="true"></span>
            <span class="pointer" aria-hidden="true"></span>
            <canvas id="wheelCanvas" width="720" height="720"></canvas>
            <span class="wheel-center" aria-hidden="true">
              <img src="assets/logo-practica-mark.png" alt="">
            </span>
            <span class="tap-chip" id="tapChip">Toque na roleta</span>
          </button>
          <span class="wheel-shadow" aria-hidden="true"></span>
        </div>

        <p class="microcopy claim-hint" id="claimHint">A roleta só gira uma vez neste celular.</p>
      </section>

      <section class="screen result-screen" id="resultScreen" aria-labelledby="resultTitle">
        <p class="kicker">Parabéns, <span id="resultName">participante</span></p>
        <h2 id="resultTitle">Você ganhou</h2>

        <div class="winner" aria-live="polite">
          <span>Seu prêmio</span>
          <strong id="winnerText">Aguardando giro</strong>
        </div>
        <p class="result-code" id="resultCode" hidden></p>

        <form class="claim-form" id="claimForm">
          <button class="whatsapp-button" id="whatsappButton" type="submit">Enviar pelo WhatsApp</button>
        </form>

        <p class="microcopy" id="resultNote">Mostre a mensagem para a equipe conferir seu nome na lista do jantar.</p>
      </section>
    </main>

    <div class="name-sheet" id="nameSheet" aria-hidden="true" hidden>
      <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="nameTitle">
        <button class="sheet-close" id="closeNameSheet" type="button" aria-label="Fechar">×</button>
        <span class="sheet-handle" aria-hidden="true"></span>
        <h2 id="nameTitle">Qual é seu nome?</h2>
        <form class="entry-form" id="nameForm">
          <label for="guestName">Nome completo</label>
          <input id="guestName" name="guestName" type="text" autocomplete="name" placeholder="Nome e sobrenome" required>
          <button class="primary-button" id="startButton" type="submit">Começar o giro</button>
        </form>
      </div>
    </div>

    <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
    <script src="config.js"></script>
    <script src="app.js?v=oficial-1-device-details2"></script>
  </body>
</html>
